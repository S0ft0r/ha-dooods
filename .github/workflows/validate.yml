name: Validate Home Assistant components

on:
  push:
    paths:
      - "custom_components/**"
      - "local_apps/**"
      - ".github/workflows/validate.yml"
      - ".github/scripts/**"
      - ".github/requirements-validator.txt"
  pull_request:
    paths:
      - "custom_components/**"
      - "local_apps/**"
      - ".github/workflows/validate.yml"
      - ".github/scripts/**"
      - ".github/requirements-validator.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate integration and App files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-validator.txt

      - name: Install validator dependency
        run: python -m pip install -r .github/requirements-validator.txt

      - name: Validate only custom_components/dooods and local_apps/dooods2
        run: python .github/scripts/validate_components.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript under the integration and App directories
        run: python .github/scripts/validate_javascript.py
