<!DOCTYPE html>
<html>
<head>
  <title>DOOODS Web Interface...</title>
  <style>
    body {
      background-color: steelblue;
      font-family: sans-serif;
    }
    #logo {
      position: relative;
      float: left;
    }
    #title {
      position: relative;
      float: left;
    }
    h1 {
      color: #333333;
      margin-left: 10px;
    }
    #body {
      clear: both;
      padding-top: 5px;
    }
    h4 {
      margin: 0px;
    }
    #detection_request_header {
      display: flex;
      align-items: center;
    }
    #detect_request {
      width: 90%;
    }
    #json {
      width: 90%;
      height: 100vh;
    }
    </style>
</head>
<script>
const reader = new FileReader();
const pathParts = window.location.pathname.split('/').filter(Boolean);
const appIndex = pathParts.findIndex((part, i) => part === 'app' && /^(?:local|[a-z0-9]+)_dooods2-dev$/.test(pathParts[i + 1] || ''));
const appRootPath = appIndex >= 0 ? `/${pathParts.slice(0, appIndex + 2).join('/')}/` : new URL('./', window.location.href).pathname;
const apiUrl = path => new URL(path.replace(/^\/+/, ''), new URL(appRootPath, window.location.origin)).toString();
let csrfPromise = null;
let streamController = null;
let imageObjectUrl = null;

function loadFile() {
  const file = document.getElementById('file').files[0];
  if (file) reader.readAsDataURL(file);
}
async function getCsrfToken() {
  if (!csrfPromise) csrfPromise = fetch(apiUrl('ingress/csrf'), {credentials:'same-origin', cache:'no-store'})
    .then(async response => {
      if (!response.ok) throw new Error(`Ingress недоступен (HTTP ${response.status})`);
      const data = await response.json();
      if (typeof data.token !== 'string') throw new Error('Некорректный токен Ingress');
      return data.token;
    }).catch(error => { csrfPromise = null; throw error; });
  return csrfPromise;
}
async function postRequest(path, data, signal) {
  const token = await getCsrfToken();
  const response = await fetch(apiUrl(path), {
    method:'POST', credentials:'same-origin', cache:'no-store', signal,
    headers:{'Content-Type':'application/json', 'X-DOODS-CSRF':token},
    body:JSON.stringify(data),
  });
  if (!response.ok) {
    if (response.status === 403) csrfPromise = null;
    throw new Error(`Запрос отклонён (HTTP ${response.status})`);
  }
  return response;
}
function stopStream() {
  if (streamController) { streamController.abort(); streamController = null; }
}
function showImage(blob) {
  if (imageObjectUrl) URL.revokeObjectURL(imageObjectUrl);
  imageObjectUrl = URL.createObjectURL(blob);
  const image = document.getElementById('image');
  image.src = imageObjectUrl; image.hidden = false;
  document.getElementById('json').hidden = true;
}
function parseRequest(fromFile) {
  const request = JSON.parse(document.getElementById('detect_request').value);
  if (fromFile) {
    if (!document.getElementById('file').files[0] || reader.readyState !== FileReader.DONE || typeof reader.result !== 'string') throw new Error('Сначала выберите изображение и дождитесь загрузки.');
    request.data = reader.result.split(',')[1];
  } else request.data = document.getElementById('url').value;
  return request;
}
async function runDetection(fromFile, image) {
  stopStream();
  try {
    const response = await postRequest(image ? 'image' : 'detect', parseRequest(fromFile));
    if (image) showImage(await response.blob());
    else {
      const result = await response.json();
      const json = document.getElementById('json');
      json.value = JSON.stringify(result, null, 2); json.hidden = false;
      document.getElementById('image').hidden = true;
    }
  } catch (error) { alert(error.message); }
}
function detectImage() { return runDetection(true, true); }
function detectJSON() { return runDetection(true, false); }
function detectUrlImage() { return runDetection(false, true); }
function detectUrlJSON() { return runDetection(false, false); }

async function consumeMjpeg(streamReader, onFrame) {
  const separator = [13,10,13,10];
  let buffer = new Uint8Array(0);
  while (true) {
    const {value, done} = await streamReader.read();
    if (done) return;
    const joined = new Uint8Array(buffer.length + value.length);
    joined.set(buffer); joined.set(value, buffer.length); buffer = joined;
    if (buffer.length > 16 * 1024 * 1024) throw new Error('Слишком большой кадр потока');
    while (true) {
      let split = -1;
      for (let i = 0; i <= buffer.length - 4; i++) {
        if (separator.every((v,j) => buffer[i+j] === v)) { split = i; break; }
      }
      if (split < 0) break;
      const header = new TextDecoder().decode(buffer.subarray(0, split));
      const length = /^content-length:\s*(\d+)\s*$/im.exec(header);
      if (!header.startsWith('--frame\r\n') || !length) throw new Error('Некорректный формат потока');
      const size = Number(length[1]);
      if (!Number.isSafeInteger(size) || size < 1 || size > 16 * 1024 * 1024) throw new Error('Некорректный размер кадра');
      const end = split + 4 + size;
      if (buffer.length < end + 2) break;
      if (buffer[end] !== 13 || buffer[end+1] !== 10) throw new Error('Некорректный конец кадра');
      onFrame(buffer.slice(split + 4, end));
      buffer = buffer.slice(end + 2);
    }
  }
}
async function detectUrlStream() {
  stopStream();
  const controller = new AbortController(); streamController = controller;
  try {
    const response = await postRequest('stream', parseRequest(false), controller.signal);
    if (!response.body) throw new Error('Браузер не поддерживает потоковый ответ');
    const streamReader = response.body.getReader();
    try { await consumeMjpeg(streamReader, bytes => showImage(new Blob([bytes], {type:'image/jpeg'}))); }
    finally { streamReader.releaseLock(); }
  } catch (error) {
    if (error.name !== 'AbortError') alert(error.message);
  } finally { if (streamController === controller) streamController = null; }
}
async function getDetectors() {
  try {
    const response = await fetch(apiUrl('detectors'), {credentials:'same-origin',cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = document.getElementById('json');
    json.value = JSON.stringify(await response.json(), null, 2); json.hidden = false;
    document.getElementById('image').hidden = true;
  } catch (error) { alert(error.message); }
}
function setDetectorName(e) {
  try {
    const input = document.getElementById('detect_request');
    const data = JSON.parse(input.value); data.detector_name = e.target.value;
    input.value = JSON.stringify(data, null, 2);
  } catch (error) { alert('could not parse detect request: ' + error.message); }
}
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const response = await fetch(apiUrl('detectors'), {credentials:'same-origin',cache:'no-store'});
    if (!response.ok) return;
    const data = await response.json();
    const select = document.getElementById('detector_names');
    for (const detector of data.detectors || []) {
      const option = document.createElement('option'); option.value = detector.name;
      option.textContent = detector.name; select.appendChild(option);
    }
    if (select.options.length) select.dispatchEvent(new Event('change'));
  } catch (_) { /* manual retries remain available */ }
});
window.addEventListener('pagehide', stopStream);
</script>
<body>
<div id="logo"><img src="doods.jpg"/></div>
<div id="title"><h1>DOODS Web Interface</h3></div>
<div style="clear:both;padding:0 10px 10px">
  <a href="./profiles.html" style="color:#102f4a;font-weight:700">Редактор профилей зон Overhaul →</a>
  <span id="faces-link" hidden> &nbsp;·&nbsp;
    <a href="./faces.html" style="color:#102f4a;font-weight:700">faces: диагностика, кадры и галерея →</a>
  </span>
  <script>
    fetch('./capabilities').then(response => response.ok ? response.json() : null)
      .then(data => {
        if (data && data.features && (data.features.includes('face_debug_dashboard') || data.features.includes('face_summary'))) {
          document.getElementById('faces-link').hidden = false;
        }
      }).catch(() => {});
  </script>
</div>
<div id="body">
<hr/>
<div id=detection_request_header>
  Detection Request
  &nbsp;&nbsp;
  <a href="https://github.com/snowzach/doods2#detect-request" target="_blank">
    <img src="link.png"/>
  </a>
  &nbsp;&nbsp;
  <button type="button" onclick=getDetectors()>Show Configured Detectors</button>
  &nbsp;&nbsp;
  Detectors: <select id="detector_names" onchange=setDetectorName(event)></select>
</div>
<h4></h4>

<textarea id="detect_request" rows=12>
{
  "id": "manual",
  "detector_name": "default",
  "preprocess": [],
  "detect": {
    "*": 50
  },
  "regions": [
    {"top": 0.1, "left": 0.1, "bottom": 0.9, "right": 0.9, "detect": {"*":50}, "covers": false}
  ]
}  
</textarea>
<hr/>

Image:
<input id="file" type="file" onchange="loadFile()">
&nbsp;&nbsp;
<button type="button" onclick=detectImage()>Detect Image</button>
<button type="button" onclick=detectJSON()>Detect JSON</button>
<hr/>

URL: 
<input id="url" type="text" id="url" value="rtsp://user:pass@hostname:554/Streaming/Channels/101/" size="100">
<button type="button" onclick=detectUrlImage()>Detect Image</button>
<button type="button" onclick=detectUrlJSON()>Detect JSON</button>
<button type="button" onclick=detectUrlStream()>Detect Stream</button>
<button type="button" onclick=stopStream()>Stop Stream</button>
<br/>
Supports http://, https://, ftp:// or rtsp:// for both an image or video stream. (Detect stream willl only work with a video stream)
<hr/>

<img id="image" hidden="true"/>
<textarea id="json" hidden="true" rows=12></textarea>
</div>
</body>
</html>
