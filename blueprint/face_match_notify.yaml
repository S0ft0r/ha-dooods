blueprint:
  name: DOOODS — уведомление о совпадении лица
  description: >
    Реакция на события распознавания лиц DOOODS2 (dooods_face_match).
    Отправляет уведомление при подтверждённом (matched) или неоднозначном
    (ambiguous) совпадении с человеком из галереи. Замок открывается только
    при подтверждённом совпадении matched; при ambiguous замок не открывается.
    Дополнительно можно отфильтровать события по ID человека, имени или камере.
  domain: automation
  source_url: https://github.com/S0ft0r/ha-dooods/blob/main/blueprint/face_match_notify.yaml
  author: Softor

  input:
    person_name:
      name: Имя человека (необязательно)
      description: >
        Оставьте пустым, чтобы реагировать на любое имя. Укажите отображаемое имя
        из галереи, чтобы реагировать только на конкретного человека.
      default: ""
      selector:
        text:
    camera_entity_id:
      name: Камера (необязательно)
      description: >
        Оставьте пустым, чтобы реагировать на любую камеру. Укажите entity_id
        камеры (например, camera.entry_1), чтобы реагировать только на совпадения
        с этой камеры.
      default: ""
      selector:
        entity:
          domain: camera
    notification_service:
      name: Сервис уведомлений
      description: >
        Сервис, который вызывается при matched и ambiguous.
        Можно указать notify.mobile_app_<ваше_устройство>.
      default: []
      selector:
        entity:
          filter:
            - domain:
                - notify
          multiple: true
    lock_entity:
      name: Замок, который надо открыть (необязательно)
      description: >
        Оставьте пустым, чтобы пропустить. Замок открывается только при matched.
        При ambiguous отправляется уведомление, но открытие замка не выполняется.
      default: ""
      selector:
        entity:
          domain: lock

trigger:
  - platform: event
    event_type: dooods_face_match

variables:
  state: "{{ trigger.event.data.state }}"
  person_name: "{{ trigger.event.data.person_name }}"
  camera_entity_id: "{{ trigger.event.data.camera_entity_id }}"
  similarity: "{{ trigger.event.data.similarity }}"
  timestamp: "{{ trigger.event.data.timestamp }}"

condition:
  - condition: template
    value_template: >
      {% set expected_person_name = person_name | string %}
      {% set expected_camera = camera_entity_id | string %}
      {{ state in ["matched", "ambiguous"]
         and (expected_person_name == "" or person_name == expected_person_name)
         and (expected_camera == "" or camera_entity_id == expected_camera) }}

action:
  - parallel:
      - action: notify.send_message
        target:
          entity_id: !input notification_service
        data:
          title: >
            {{ "DOOODS — неоднозначное совпадение" if state == "ambiguous"
               else "DOOODS — совпадение лица" }}
          message: >
            {% if state == "ambiguous" %}⚠️ Неоднозначное совпадение лица{% else %}👤 Совпадение лица{% endif %}: {{ person_name }}
            Сходство: {{ similarity }}
            Время: {{ timestamp }}

        continue_on_error: true
      - if:
          - condition: template
            value_template: >
              {{ state == "matched" and input.lock_entity | string != "" }}
        then:
          - service: lock.open
            target:
              entity_id: "{{ input.lock_entity }}"
            data: {}
            continue_on_error: true
