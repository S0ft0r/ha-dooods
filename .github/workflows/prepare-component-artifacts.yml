name: Prepare independent component artifacts

# Deliberately does not publish GitHub Releases or push to either Store.
# A single monorepo release stream would make HACS interpret the latest release
# tag as the integration version, even when that release belonged to the App.
# These separate tags only build downloadable CI artifacts.
on:
  push:
    tags:
      - "dooods-integration-v*"
      - "dooods2-app-v*"
  workflow_dispatch:
    inputs:
      component:
        description: Component to package (each output remains an independent ZIP)
        type: choice
        required: true
        default: all
        options:
          - all
          - integration
          - app

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package component(s)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve component and verify tag naming
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_COMPONENT: ${{ github.event.inputs.component }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            case "$REF_NAME" in
              dooods-integration-v*) component="integration" ;;
              dooods2-app-v*) component="app" ;;
              *) echo "Unsupported release tag: $REF_NAME" >&2; exit 1 ;;
            esac
            expected_tag="$REF_NAME"
          else
            component="${DISPATCH_COMPONENT:-all}"
            expected_tag=""
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "expected_tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "Packaging selection: $component"
          if [[ -n "$expected_tag" ]]; then echo "Tag to verify: $expected_tag"; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-validator.txt

      - name: Install validator dependency
        run: python -m pip install -r .github/requirements-validator.txt

      - name: Validate selected component metadata, syntax, and App mirror
        env:
          COMPONENT: ${{ steps.target.outputs.component }}
        run: |
          set -euo pipefail
          python .github/scripts/validate_components.py --component "$COMPONENT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript in the selected component
        env:
          COMPONENT: ${{ steps.target.outputs.component }}
        run: python .github/scripts/validate_javascript.py --component "$COMPONENT"

      - name: Build separate component ZIPs
        id: package
        shell: bash
        env:
          COMPONENT: ${{ steps.target.outputs.component }}
          EXPECTED_TAG: ${{ steps.target.outputs.expected_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/dooods-component-artifacts
        run: |
          set -euo pipefail
          args=(--component "$COMPONENT" --output-dir "$OUTPUT_DIR")
          if [[ -n "$EXPECTED_TAG" ]]; then args+=(--expected-tag "$EXPECTED_TAG"); fi
          python .github/scripts/package_component_artifacts.py "${args[@]}"

      - name: Upload integration artifact
        if: steps.package.outputs.integration_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dooods-integration-${{ steps.package.outputs.integration_version }}
          path: ${{ runner.temp }}/dooods-component-artifacts/integration/
          if-no-files-found: error
          retention-days: 30

      - name: Upload App artifact
        if: steps.package.outputs.app_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dooods2-app-${{ steps.package.outputs.app_version }}
          path: ${{ runner.temp }}/dooods-component-artifacts/app/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: dooods-build-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/dooods-component-artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 30
