blueprint:
  name: DOOODS — уведомление о совпадении лица/движения
  description: >
    Реакция на события распознавания лиц DOOODS2 (dooods_face_match) и детекция движения (dooods_detection).
    Отправляет уведомление при подтверждённом (matched) или неоднозначном
    (ambiguous) совпадении с человеком из галереи. Замок открывается только
    при подтверждённом совпадении matched; при ambiguous замок не открывается.
#    Дополнительно можно отфильтровать события по имени человека или камере.
  domain: automation
  source_url: https://github.com/S0ft0r/ha-dooods/blob/main/blueprint/face_match_notify.yaml
  author: Softor

  input:
    automation_options:
      name: Режимы работы
      description: Режимы работы автоматизации
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: Детектирование объектов
              value: dooods_detection_options
            - label: Распознование лиц
              value: dooods_face_match_options

    object_section:
      name: Настройки детектирования объектов
      icon: mdi:cube-scan
      collapsed: true
      input:
#         camera_entity:
#           name: Камера
#           description: >
#             Описание
#           default: []
#           selector:
#             entity:
#               domain: camera
# #              integration: dooods
#               multiple: true
        immich_instance:
          name: Интеграция Immich (необязательно)
          description: Выберите настроенный экземпляр интеграции Immich в Home Assistant.
          default: ""
          selector:
            config_entry:
              integration: immich
        immich_album_id:
          name: ID альбома Immich (необязательно)
          description: >
            Укажите ID из последней части адреса альбома в веб-интерфейсе Immich.
            Пустое значение означает, что альбом не выбран.
          default: ""
          selector:
            text:
        record_duration:
          name: Время записи
          description: >
            Время записи.
          default: 20
          selector:
            number:
              min: 10
              max: 120
              step: 10
              unit_of_measurement: 'сек'
              mode: slider

    face_section:
      name: Настройки распознавания лиц
      icon: mdi:face-recognition
      collapsed: true
      input:
        notify_ambiguous:
          name: Уведомлять о неоднозначном совпадении
          description: При выключении уведомления ambiguous не отправляются. Замок при ambiguous никогда не открывается.
          default: true
          selector:
            boolean:
        person_name:
          name: Имя человека (необязательно)
          description: >
            Оставьте пустым, чтобы реагировать на любое имя. Укажите отображаемое имя
            из галереи, чтобы реагировать только на конкретного человека.
          default: ""
          selector:
            text:
#         camera_entity_id:
#           name: Камера (необязательно)
#           description: >
#             Оставьте пустым, чтобы реагировать на любую камеру. Укажите entity_id
#             камеры (например, camera.entry_1), чтобы реагировать только на совпадения
#             с этой камеры.
#           default: ""
#           selector:
#             entity:
#               domain: camera
# #              integration: dooods
        lock_entity:
          name: Замок, который надо открыть (необязательно)
          description: >
            Оставьте пустым, чтобы пропустить. Замок открывается только при matched.
            При ambiguous отправляется уведомление, но открытие замка не выполняется.
          default: ""
          selector:
            entity:
              domain: lock
        similarity:
          name: Процент похожести
          description: >
            Выберите минимальный процент похожести лица, при котором будет открыт замок.
          default: 55
          selector:
            number:
              min: 40
              max: 100
              step: 5
              unit_of_measurement: '%'
              mode: slider

    notification_section:
      name: Настройки уведомлений
      icon: mdi:bell-outline
      collapsed: true
      input:
        notification_service:
          name: Сервис уведомлений
          description: >
            Сервис, который вызывается при matched и ambiguous.
            Можно указать notify.<ваше_устройство>.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - notify
              multiple: true

variables:
#  camera_entity: !input camera_entity
  expected_person_name: !input person_name
  notify_ambiguous: !input notify_ambiguous
#  expected_camera: !input camera_entity_id
  expected_similarity: !input similarity
  lock_entity: !input lock_entity
  notification_service: !input notification_service
  immich_instance: !input immich_instance
  immich_album_id: !input immich_album_id
  record_duration: !input record_duration

trigger_variables:
  automation_options: !input automation_options
  is_face_enabled: "{{ 'dooods_face_match_options' in automation_options }} "
  is_object_enabled: "{{ 'dooods_detection_options' in automation_options }} "

trigger:
  - platform: event
    event_type: dooods_face_match
    id: dooods_face_match_trigger
    enabled: "{{ is_face_enabled }}"

  - platform: event
    event_type: dooods_detection
    id: dooods_detection_trigger
    enabled: "{{ is_object_enabled }}"

mode: single
#max: 25

action:
  - variables:
      state: "{{ trigger.event.data.get('state') or '' }}"
      person_name: "{{ trigger.event.data.get('person_name') or '' }}"
      camera_entity_id: "{{ trigger.event.data.get('camera_entity_id') or '' }}"
      similarity: "{{ trigger.event.data.get('similarity') | float(0) }}"
      timestamp: "{{ trigger.event.data.get('timestamp') or '' }}"
      labels: "{{ trigger.event.data.get('labels_translated') or trigger.event.data.get('labels') or [] }}"
      detections: "{{ trigger.event.data.get('detections') or [] }}"
      image_entity_id: "{{ trigger.event.data.get('image_entity_id') or '' }}"

      mobile_app_list: |
        {{  integration_entities('mobile_app')
          | select('match', 'notify')
          | intersect(notification_service)
          | map('replace', 'notify.', 'notify.mobile_app_')
          | list }}

      snapshot_name: "{{ camera_entity_id.split('.')[1] }}_latest.jpg"
      record_name: "{{ camera_entity_id.split('.')[1] }}_latest.mp4"

  - choose:
      - conditions:
          - condition: trigger
            id: dooods_detection_trigger
        sequence:
            - action: image.snapshot
              metadata: {}
              target:
                entity_id: "{{ image_entity_id }}"
              data:
                filename: "/config/www/snapshots/{{ snapshot_name }}"
            - parallel:
                - sequence:
                  - repeat:
                      for_each: "{{ mobile_app_list }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          metadata: {}
                          data:
                            message: clear_notification
                            data:
                              tag: detection_notification
                        - action: "{{ repeat.item }}"
                          data:
                            title: >
                              {{ "DOOODS — движение на камере" }}
                            message: |
                              Объекты: {{ labels | join(', ') }}
                              Время: {{ as_timestamp(timestamp) | timestamp_custom('%H:%M', true) }}
                            data:
                              tag: detection_notification
                              image: "/local/snapshots/{{ snapshot_name }}"
                              clickAction: app://app.alextran.immich
                              actions:
                                - action: URI
                                  title: Просмотр камер
                                  uri: homeassistant://navigate/lovelace/cctv
                - sequence:
                    - parallel:
                        - sequence:
                            - action: immich.upload_file
                              metadata: {}
                              data:
                                config_entry_id: "{{ immich_instance }}"
                                file:
                                  media_content_id: "media-source://media_source/snapshots/{{ snapshot_name }}"
                                  media_content_type: image/jpeg
                                album_id: "{{ immich_album_id }}"
                        - sequence:
                            - data:
                                duration: '{{ record_duration }}'
                                filename: "/config/www/records/{{ record_name }}"
                              target:
                                entity_id: "{{ camera_entity_id }}"
                              action: camera.record
                            - action: immich.upload_file
                              metadata: {}
                              data:
                                config_entry_id: "{{ immich_instance }}"
                                file:
                                  media_content_id: media-source://media_source/records/{{ record_name }}
                                  media_content_type: video/mp4
                                album_id: "{{ immich_album_id }}"

  - choose:
      - conditions:
          - condition: trigger
            id: dooods_face_match_trigger
          - condition: template
            value_template: >
              {{ (state == "matched" or (state == "ambiguous" and notify_ambiguous))
                and (expected_person_name == "" or person_name == expected_person_name) }}

        sequence:
            - parallel:
                - sequence:
                  - repeat:
                      for_each: "{{ mobile_app_list }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          metadata: {}
                          data:
                            message: clear_notification
                            data:
                              tag: face_match_notification
                        - action: "{{ repeat.item }}"
                          data:
                            title: >
                              {{ "DOOODS — неоднозначное совпадение" if state == "ambiguous"
                                else "DOOODS — совпадение лица" }}
                            message: |
                              {% if state == "ambiguous" %}⚠️ Неоднозначное совпадение лица{% else %}👤 Совпадение лица: {{ person_name }}{% endif %}
                              Сходство: {{ (similarity * 100) | int }}
                              Время: {{ timestamp }}
                            data:
                              tag: face_match_notification
                - if:
                    - condition: template
                      value_template: >
                        {{ (state == "matched" and lock_entity | string != "") and ((similarity | float(0.39) * 100) | int >= expected_similarity | int(40)) }}
                  then:
                    - service: lock.unlock
                      target:
                        entity_id: !input lock_entity
                      data: {}
                      continue_on_error: true
