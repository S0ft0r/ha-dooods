name: Create DOOODS GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-dooods-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-validator.txt

      - name: Install validator dependencies
        run: python -m pip install -r .github/requirements-validator.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate current component versions and source
        run: |
          set -euo pipefail
          python .github/scripts/validate_components.py --component all
          python .github/scripts/validate_javascript.py --component all
          python .github/scripts/validate_javascript_project.py

      - name: Resolve versions and release paths
        id: release
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path
          import yaml

          manifest = json.loads(Path("custom_components/dooods/manifest.json").read_text(encoding="utf-8"))
          app_config = yaml.safe_load(Path("local_apps/dooods2/config.yaml").read_text(encoding="utf-8"))
          integration = manifest.get("version")
          app = app_config.get("version") if isinstance(app_config, dict) else None
          version_pattern = re.compile(r"^\d+\.\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$")
          if not isinstance(integration, str) or not version_pattern.fullmatch(integration):
              raise SystemExit("Invalid integration version in manifest.json")
          if not isinstance(app, str) or not version_pattern.fullmatch(app):
              raise SystemExit("Invalid App version in config.yaml")

          archive = f"dooods_release_{integration}__{app}_components_with_github_actions.zip"
          tag = f"dooods-bundle-v{integration}__app-v{app}"
          title = f"DOOODS {integration} + DOOODS2 App {app}"
          print(f"integration_version={integration}")
          print(f"app_version={app}")
          print(f"archive={archive}")
          print(f"tag={tag}")
          print(f"title={title}")
          PY

      - name: Build the focused release ZIP
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          python .github/scripts/build_release_tooling_bundle.py \
            --output "releases/$ARCHIVE" \
            --overwrite
          sha256sum "releases/$ARCHIVE" | awk '{print $1 "  " $2}' > "releases/$ARCHIVE.sha256"

      - name: Create GitHub prerelease and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          INTEGRATION_VERSION: ${{ steps.release.outputs.integration_version }}
          APP_VERSION: ${{ steps.release.outputs.app_version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A Git tag already exists for $RELEASE_TAG; refusing to reuse it." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## DOOODS component bundle

          - Integration: $INTEGRATION_VERSION
          - Home Assistant App: $APP_VERSION
          - Asset: $ARCHIVE

          This is a combined **prerelease** for the stated component versions. It does not publish to HACS or the Home Assistant Apps Store. Component-specific distribution remains separate.
          EOF
          gh release create "$RELEASE_TAG" \
            "releases/$ARCHIVE" \
            "releases/$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease

      - name: Summarize published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          {
            echo "## GitHub Release created"
            echo
            echo "- Release: $RELEASE_URL"
            echo "- Asset: $ARCHIVE"
            echo "- No GitHub Actions artifact upload or Store publication was performed."
          } >> "$GITHUB_STEP_SUMMARY"
