configuration:
  logger:
    name: Журнал
    fields:
      level:
        name: Уровень журнала
        description: Подробность сообщений приложения.
  server:
    name: API-сервер
    description: Параметры API и хранилища приложения.
    fields:
      host:
        name: Адрес прослушивания
        description: Оставьте 0.0.0.0, чтобы Home Assistant Ingress мог подключиться к интерфейсу.
      port:
        name: Внутренний порт
        description: Оставьте 8080 — это порт контейнера для Ingress.
      auth_key:
        name: API-ключ
        description: Если поле пустое, при первом запуске создаётся случайный ключ и сохраняется в настройках App через Supervisor. Скопируйте его в настройку интеграции dooods; не передавайте ключ в URL, логи или браузерный редактор.
      profiles_file:
        name: Файл профилей
        description: Постоянный JSON-файл в каталоге данных приложения.
      metrics:
        name: Метрики Prometheus
      trace:
        name: Трассировка памяти
        description: Диагностика; в обычном режиме оставьте выключенной.
  face:
    name: Настройки распознавания лиц
    description: Параметры alpha-обработки YuNet/SFace для RTSP-кадров-кандидатов.
    fields:
      enabled:
        name: Определение лиц
        description: Включает распознавание лиц, страницу Faces и API галереи. Изменение применяется после перезапуска App; данные не удаляются.
      yunet_score_threshold:
        name: Порог уверенности YuNet
        description: Диапазон 0.1–1.0; по умолчанию 0.9. Меньшее значение находит больше слабых/маленьких лиц, но может увеличить ложные обнаружения. Изменение применяется после перезапуска App.
      face_match_threshold:
        name: Порог совпадения SFace
        description: Диапазон 0.1–1.0; по умолчанию 0.4 (40% по шкале сходства, не вероятности). Ниже порога результат «неизвестно». При сходстве не ниже порога результат «совпадение», если отрыв от другого человека достаточен, иначе «неоднозначно». Для SFace 2021dec рекомендуется 0.36–0.45.
      face_match_min_gap:
        name: Минимальный отрыв от другого человека
        description: Диапазон 0.0–0.5; по умолчанию 0.1 (10 процентных пунктов шкалы сходства). Если сходство выше порога, но отрыв от следующего человека меньше этого значения, результат «неоднозначно». Большие значения уменьшают риск ошибочного «совпадения», но чаще дают «неоднозначно».
      min_face_width:
        name: Минимальная ширина лица, px
        description: Кадры с лицом уже этого значения не попадают в буфер диагностики. По умолчанию 100.
      min_face_height:
        name: Минимальная высота лица, px
        description: Кадры с лицом ниже этого значения не попадают в буфер диагностики. По умолчанию 100.
  doods:
    name: Распознавание
    description: Детектор и настройки разметки по умолчанию.
    fields:
      log:
        name: Журналирование детекций
      annotation_labels:
        name: Пользовательские подписи меток (JSON)
        description: Необязательный JSON-словарь отображаемых подписей по языкам, например {"ru":{"door":"дверь"},"en":{"door":"door"}}. Метки в ответах API остаются исходными.
      boxes:
        name: Рамки объектов
        fields:
          enabled:
            name: Рисовать рамки
          showLabels:
            name: Показывать подписи объектов
            description: Показывать над рамкой класс объекта и уверенность детектора либо количество объединённых объектов. Скрытие подписи не скрывает рамку и не меняет ответы API.
          mergeOverlapping:
            name: Объединять перекрывающиеся рамки одного класса
            description: Рисовать одну рамку и общую подпись с числом объектов одного класса, если рамки имеют область перекрытия. Детекции и подсчёты API не меняются.
          boxPaddingPercent:
            name: Отступ рамки (%)
            description: Расширять каждую сторону на этот процент от ширины или высоты рамки детектора. Отступ влияет только на размеченное изображение, не меняет детекции API или проверку зон и ограничивается границами кадра.
          boxColor:
            name: Цвет рамки
          boxThickness:
            name: Толщина рамки
          fontScale:
            name: Размер шрифта метки
          fontColor:
            name: Цвет метки
          fontThickness:
            name: Толщина шрифта
      regions:
        name: Разметка областей
        description: В профильном режиме показывает контуры полигональных зон и их имена; в legacy-режиме — прямоугольные области.
        fields:
          enabled:
            name: Рисовать зоны и области
          boxColor:
            name: Цвет области
          boxThickness:
            name: Толщина линии области
          fontScale:
            name: Размер шрифта метки
          fontColor:
            name: Цвет метки
          fontThickness:
            name: Толщина шрифта
      globals:
        name: Диагностическая разметка
        description: Список глобальных порогов отображается только при уровне журнала Debug.
        fields:
          enabled:
            name: Показывать общие пороги в debug
          fontScale:
            name: Размер шрифта метки
          fontColor:
            name: Цвет метки
          fontThickness:
            name: Толщина шрифта
      detectors:
        name: Детекторы
        description: По умолчанию включена одна CPU-модель TFLite.
        fields:
          name:
            name: Имя детектора
          type:
            name: Тип backend
          modelFile:
            name: Файл модели
          labelFile:
            name: Файл меток
          labelsStartFromZero:
            name: Индексация меток начинается с нуля
          hwAccel:
            name: Аппаратное ускорение
          numThreads:
            name: Потоки CPU
