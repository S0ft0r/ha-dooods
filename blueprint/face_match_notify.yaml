blueprint:
  name: DOOODS — уведомление о совпадении лица
  description: >
    Реакция на события распознавания лиц DOOODS2 (dooods_face_match).
    Отправляет уведомление, когда распознанное лицо совпало с человеком из галереи
    на выбранной камере. Дополнительно можно отфильтровать по ID человека, имени
    или камере, включить свет или вызвать любой сервис.
  domain: automation
  source_url: https://github.com/S0ft0r/ha-dooods/blob/main/blueprint/face_match_notify.yaml
  author: Softor

  input:
    person_id:
      name: ID человека (необязательно)
      description: >
        Оставьте пустым, чтобы реагировать на любого человека. Укажите person_id
        из галереи, чтобы реагировать только на конкретного человека.
      default: ""
      selector:
        text:
    person_name:
      name: Имя человека (необязательно)
      description: >
        Оставьте пустым, чтобы реагировать на любое имя. Укажите отображаемое имя
        из галереи, чтобы реагировать только на конкретного человека.
      default: ""
      selector:
        text:
    camera_entity_id:
      name: Камера (необязательно)
      description: >
        Оставьте пустым, чтобы реагировать на любую камеру. Укажите entity_id
        камеры (например, camera.entry_1), чтобы реагировать только на совпадения
        с этой камеры.
      default: ""
      selector:
        entity:
          domain: camera
    notification_service:
      name: Сервис уведомлений
      description: >
        Сервис, который вызывается при каждом совпадении. 
        Можно указать notify.mobile_app_<ваше_устройство>.
      default: []
      selector:
        entity:
          filter:
            - domain:
                - notify
          multiple: true
    lock_entity:
      name: Замок, который надо открыть (необязательно)
      description: >
        Оставьте пустым, чтобы пропустить. Укажите entity_id замка: он откроется
        при совпадении лица.
      default: ""
      selector:
        entity:
          domain: lock
    # light_off_delay:
    #   name: Задержка выключения света (секунды)
    #   description: >
    #     Через сколько секунд выключить свет. 0 — оставить включённым.
    #   default: 30
    #   selector:
    #     number:
    #       min: 0
    #       max: 3600
    #       step: 1
    message_template:
      name: Шаблон сообщения
      description: >
        Шаблон Jinja2 для текста уведомления. Доступные переменные:
        person_name, person_id, camera_entity_id, similarity, timestamp.
      default: >
        👤 Совпадение лица: {{ person_name }} ({{ person_id }})
        Камера: {{ camera_entity_id }}
        Сходство: {{ similarity }}
        Время: {{ timestamp }}
      selector:
        text:
trigger:
  - platform: homeassistant
    event_type: dooods_face_match
condition:
  - condition: template
    value_template: >
      {% set person_id = trigger.event.data.person_id | string %}
      {% set person_name = trigger.event.data.person_name | string %}
      {% set camera = trigger.event.data.camera_entity_id | string %}
      {% if input.person_id | string != "" and person_id != input.person_id | string %}
        {% return false %}
      {% endif %}
      {% if input.person_name | string != "" and person_name != input.person_name | string %}
        {% return false %}
      {% endif %}
      {% if input.camera_entity_id and camera != input.camera_entity_id %}
        {% return false %}
      {% endif %}
      {% return true %}
action:
  - parallel:
      - service: "{{ input.notification_service }}"
        data:
          title: "DOOODS — совпадение лица"
          message: "{{ input.message_template }}"
          continue_on_error: true
      - service: lock.open
        target:
          entity_id: "{{ input.lock_entity }}"
        data: {}
        enabled: "{{ input.lock_entity != '' }}"
        continue_on_error: true
